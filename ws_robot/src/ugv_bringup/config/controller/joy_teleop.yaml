joy:
  ros__parameters:
    # device_name: /dev/input/joypad-f710
    device_id: 0
    deadzone: 0.1          # Output is zero for axis in deadzone. Range: [-0.9, 0.9]. Default 0.05
    autorepeat_rate: 20.0   # If no events, repeats last known state at this rate. Defualt: 0 (disabled)
    coalesce_interval: 0.001 # Waits for this interval (seconds) after receiving an event. If multiple events happen in this interval, only one message will be sent. Reduces number of messages. Default: 0.001.

joy_teleop:
  ros__parameters:
    default:
      type: topic
      interface_type: ackermann_msgs/msg/AckermannDriveStamped
      topic_name: cmd_auto/default
      axis_mappings:
        drive-speed:
          axis: 1
          scale: 0.0
          offset: 0.0
        drive-steering_angle:
          axis: 2
          scale: 0.0
          offset: 0.0

    joy_control:
      type: topic
      interface_type: ackermann_msgs/msg/AckermannDriveStamped
      topic_name: cmd_teleop/joy_raw    # teleop_speed_multiplier scales the speed with LT and publishes cmd_teleop/joy
      deadman_buttons: [6]
      axis_mappings:
        drive-speed:
          axis: 1
          scale: 1.0
          offset: 0.0
        drive-steering_angle:
          axis: 2
          scale: 0.4
          offset: 0.0

    # Off: X switches the collision brake now (f1tenth_tools drive_coordinator). This drove the autonomous channel
    # from the stick at 10x speed without the LB deadman while X was held.
    # joy_control_auto_test:
    #   type: topic
    #   interface_type: ackermann_msgs/msg/AckermannDriveStamped
    #   topic_name: cmd_auto/joy
    #   deadman_buttons: [3]
    #   axis_mappings:
    #     drive-speed:
    #       axis: 1
    #       scale: 10.0
    #       offset: 0.0
    #     drive-steering_angle:
    #       axis: 2
    #       scale: 0.4
    #       offset: 0.0
    
    # gradual_braking:
    #   type: topic
    #   interface_type: std_msgs/msg/Float64
    #   topic_name: commands/motor/brake
    #   axis_mappings:
    #     data:
    #       axis: 4
    #       scale: -5.0
    #       offset: 5.0

    teleop_cutoff_and_brake_enabler:
      type: topic
      interface_type: std_msgs/msg/Bool
      topic_name: mux_bool/teleop_cutoff_and_brake
      deadman_buttons: [7]
      message_value:
        data:
          value: True

    teleop_cutoff_and_brake_disabler:
      type: topic
      interface_type: std_msgs/msg/Bool
      topic_name: mux_bool/teleop_cutoff_and_brake
      deadman_buttons: [6]
      message_value:
        data:
          value: False

    autonomous_cutoff_and_brake_enabler:
      type: topic
      interface_type: std_msgs/msg/Bool
      topic_name: mux_bool/autonomous_cutoff_and_brake
      deadman_buttons: [7]
      message_value:
        data:
          value: True

    autonomous_cutoff_and_brake_disabler:
      type: topic
      interface_type: std_msgs/msg/Bool
      topic_name: mux_bool/autonomous_cutoff_and_brake
      deadman_buttons: [6]
      message_value:
        data:
          value: False

    # autonomous_control:
    #   type: topic
    #   interface_type: std_msgs/msg/Int8
    #   topic_name: /dev/null
    #   deadman_buttons: [0]
    #   message_value:
    #     data:
    #       value: 0

teleop_speed_multiplier:
  ros__parameters:
    joy_topic: /joy
    multiplier_axis: 5      # LT (Xbox One S over Bluetooth): 1.0 released, -1.0 fully pressed
    max_multiplier: 5.0     # joy_control speed scale with LT fully pressed (1.0 m/s at full stick -> 5.0 m/s)
