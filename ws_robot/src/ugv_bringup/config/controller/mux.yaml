ackermann_mux:
  ros__parameters:
    topics:
      default:
          topic   : cmd_auto/default
          timeout : 0.1
          priority: 1
      auto_drive:
        topic   : cmd_auto/drive
        timeout : 0.1
        priority: 10
      auto_recovery:
        topic   : cmd_auto/recovery
        timeout : 0.01
        priority: 100
      auto_joystick_test:
        topic   : cmd_auto/joy
        timeout : 0.1
        priority: 90
      teleop_joystick:
        topic   : cmd_teleop/joy
        timeout : 0.1
        priority: 190

    locks:
      autonomous_cutoff_and_brake:
        topic   : mux_bool/autonomous_cutoff_and_brake  # Default is True. When True, teleop will be disabled and brake will be enabled.
        timeout : 0.0   # 0.0 for no timeout and will be locked until the topic is true
        priority: 100   # Same or higher priority will not be locked
      teleop_cutoff_and_brake:
        topic   : mux_bool/teleop_cutoff_and_brake # Default is True. When True, teleop will be disabled and brake will be enabled.
        timeout : 0.0   # 0.0 for no timeout and will be locked until the topic is true
        priority: 200   # Same or higher priority will not be locked
      ui_estop:
        topic   : mux_bool/ui_estop  # E-stop from the f1tenth UI. Stays engaged until a UI releases it (the joystick can't).
        timeout : 0.0
        priority: 255